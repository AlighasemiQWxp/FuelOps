      description:
        "Current inventory/open-work metrics are snapshots. Other metrics use [from,to). Custom
        ranges are capped at 366 days. Persian month/year ranges and Tehran reporting timezone are used;
        MongoDB time buckets use its calendar semantics.

        Required permissions: dashboard.view"
