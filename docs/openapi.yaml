components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: fuel_refresh
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Actor:
      type: object
      properties:
        user_id:
          type: string
        org_id:
          type: string
        station_id:
          type: string
        station_ids:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        name:
          type: string
      required:
        - user_id
        - org_id
        - station_id
        - station_ids
        - permissions
        - name
    Session:
      type: object
      properties:
        access_token:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
      required:
        - access_token
        - actor
    Login:
      type: object
      properties:
        organization:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 1024
      required:
        - organization
        - email
        - password
    Role:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        permissions:
          type: array
          items:
            type: string
      required:
        - name
        - permissions
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
          minimum: 1
      required:
        - name
        - permissions
        - version
    Employee:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
        station_ids:
          type: array
          items:
            type: string
        role_ids:
          type: array
          items:
            type: string
      required:
        - name
        - email
        - active
        - station_ids
        - role_ids
    EmployeeInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
        station_ids:
          type: array
          items:
            type: string
        role_ids:
          type: array
          items:
            type: string
        password:
          anyOf:
            - type: string
              minLength: 12
              maxLength: 128
            - type: "null"
        version:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
      required:
        - name
        - email
        - active
        - station_ids
        - role_ids
    FuelType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
      required:
        - id
        - name
        - color
    PriceTier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        irr_per_liter:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer Iranian rials (IRR), never toman.
      required:
        - id
        - name
        - irr_per_liter
    Tank:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        fuel_type_id:
          type: string
        capacity_ml:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer milliliters. Display as liters by dividing by 1000.
        low_threshold_ml:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer milliliters. Display as liters by dividing by 1000.
        calibration_reference:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - name
        - fuel_type_id
        - capacity_ml
        - low_threshold_ml
        - calibration_reference
    Pump:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    Nozzle:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        pump_id:
          type: string
        tank_id:
          type: string
        meter_modulus_ml:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer milliliters. Display as liters by dividing by 1000.
        active:
          type: boolean
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
      required:
        - id
        - name
        - pump_id
        - tank_id
        - meter_modulus_ml
        - active
        - prices
    Station:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        city:
          type: string
        timezone:
          type: string
          enum:
            - Asia/Tehran
        demo:
          type: boolean
        fuel_types:
          type: array
          items:
            $ref: "#/components/schemas/FuelType"
        tanks:
          type: array
          items:
            $ref: "#/components/schemas/Tank"
        pumps:
          type: array
          items:
            $ref: "#/components/schemas/Pump"
        nozzles:
          type: array
          items:
            $ref: "#/components/schemas/Nozzle"
        discrepancy_tolerance_irr:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer Iranian rials (IRR), never toman.
        delivery_tolerance_ml:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer milliliters. Display as liters by dividing by 1000.
      required:
        - name
        - city
        - timezone
        - demo
        - fuel_types
        - tanks
        - pumps
        - nozzles
        - discrepancy_tolerance_irr
        - delivery_tolerance_ml
    StationUpdate:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        data:
          $ref: "#/components/schemas/Station"
      required:
        - version
        - data
    Reading:
      type: object
      properties:
        nozzle_id:
          type: string
        initial_ml:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer milliliters. Display as liters by dividing by 1000.
        final_ml:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
              description: Integer milliliters. Display as liters by dividing by 1000.
            - type: "null"
        rollovers:
          type: integer
          format: int64
          minimum: 0
          maximum: 1
        tiers:
          type: array
          items:
            type: object
            properties:
              tier_id:
                type: string
              volume_ml:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
                description: Integer milliliters. Display as liters by dividing by 1000.
            required:
              - tier_id
              - volume_ml
      required:
        - nozzle_id
        - initial_ml
        - final_ml
        - rollovers
        - tiers
    Settlement:
      type: object
      properties:
        method:
          type: string
          enum:
            - cash
            - card
            - credit
        amount_irr:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer Iranian rials (IRR), never toman.
        reference:
          type: string
          maxLength: 200
      required:
        - method
        - amount_irr
        - reference
    ShiftPhase:
      type: string
      enum:
        - Scheduled
        - Open
        - PendingReview
        - Approved
        - Closed
        - Cancelled
    ShiftCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        starts_at:
          type: integer
          format: int64
          description: UTC Unix epoch milliseconds.
        ends_at:
          type: integer
          format: int64
          description: UTC Unix epoch milliseconds.
        employee_ids:
          type: array
          items:
            type: string
        nozzle_ids:
          type: array
          items:
            type: string
      required:
        - name
        - starts_at
        - ends_at
        - employee_ids
        - nozzle_ids
    Shift:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        starts_at:
          type: integer
          format: int64
          description: UTC Unix epoch milliseconds.
        ends_at:
          type: integer
          format: int64
          description: UTC Unix epoch milliseconds.
        employee_ids:
          type: array
          items:
            type: string
        nozzle_ids:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ShiftPhase"
        equipment:
          type: array
          items:
            $ref: "#/components/schemas/Nozzle"
        readings:
          type: array
          items:
            $ref: "#/components/schemas/Reading"
        settlements:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
        reconciliation_approved:
          type: boolean
        handover_note:
          type: string
      required:
        - name
        - starts_at
        - ends_at
        - employee_ids
        - nozzle_ids
        - status
        - equipment
        - readings
        - settlements
        - reconciliation_approved
        - handover_note
    ShiftTransition:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        to:
          $ref: "#/components/schemas/ShiftPhase"
        readings:
          type: array
          items:
            $ref: "#/components/schemas/Reading"
        settlements:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
        handover_note:
          type: string
          maxLength: 2000
      required:
        - version
        - to
    ReconciliationPhase:
      type: string
      enum:
        - CollectingReadings
        - Calculating
        - ReviewingDiscrepancies
        - Approval
        - Completed
    Reconciliation:
      type: object
      properties:
        shift_id:
          type: string
        shift_name:
          type: string
        status:
          $ref: "#/components/schemas/ReconciliationPhase"
        volume_ml:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer milliliters. Display as liters by dividing by 1000.
        expected_irr:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer Iranian rials (IRR), never toman.
        settled_irr:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer Iranian rials (IRR), never toman.
        difference_irr:
          type: integer
          format: int64
        tolerance_irr:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer Iranian rials (IRR), never toman.
        investigation:
          type: string
        shift_version:
          type: integer
          format: int64
          minimum: 1
        submitted_by:
          type: string
        approved_by:
          anyOf:
            - type: string
            - type: "null"
      required:
        - shift_id
        - shift_name
        - status
        - volume_ml
        - expected_irr
        - settled_irr
        - difference_irr
        - tolerance_irr
        - investigation
        - shift_version
        - submitted_by
        - approved_by
    ReconciliationCreate:
      type: object
      properties:
        shift_id:
          type: string
      required:
        - shift_id
    ReconciliationTransition:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        to:
          $ref: "#/components/schemas/ReconciliationPhase"
        investigation:
          type: string
          maxLength: 4000
      required:
        - version
        - to
    CorrectionCreate:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        delta_irr:
          type: integer
          format: int64
          default: 0
        inventory_delta_ml:
          type: integer
          format: int64
          default: 0
          description:
            Signed recorded-inventory adjustment; requires inventory.manage and a tank from
            the original shift.
        tank_id:
          anyOf:
            - type: string
            - type: "null"
        reason:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - version
        - reason
    Correction:
      type: object
      properties:
        reconciliation_id:
