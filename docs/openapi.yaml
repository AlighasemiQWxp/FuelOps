        - name: to
          in: query
          schema:
            type: integer
            format: int64
            description: UTC Unix epoch milliseconds.
        - name: period
          in: query
          schema:
            type: string
            enum:
              - today
              - yesterday
              - 7d
              - week
              - 30d
              - month
              - previous_month
              - year
            default: 7d
        - name: interval
          in: query
