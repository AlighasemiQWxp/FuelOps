openapi: 3.1.0
info:
  title: Fuel Ops API
  version: 1.0.0
  description:
    Versioned REST contract for Fuel Ops. JWT bearer authentication, live station-scoped permissions,
    integer IRR and milliliters, UTC epoch milliseconds. Future Flutter clients can use the same API.
    All demo records are fictional.
servers:
  - url: http://localhost:8080/api/v1
    description: Local API
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Permissions
  - name: Employees
  - name: Stations
  - name: Shifts
  - name: Reconciliation
  - name: Deliveries
  - name: Inventory
  - name: Alerts
  - name: Dashboard
  - name: Audit
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in and create a revocable session
      operationId: post_auth_login
      description:
        Sets the fuel_refresh HttpOnly SameSite=Strict cookie. The access token expires in
        ten minutes.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
          description: Must exactly match WEB_ORIGIN.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Missing, expired, revoked, or invalid authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission or station boundary denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version conflict, duplicate record, or concurrent transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid fields or workflow transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Authentication rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description:
            Database unavailable or ambiguous operation result; reload authoritative state
            before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate refresh token
      operationId: post_auth_refresh
      description:
        Requires fuel_refresh cookie. Replay of a consumed refresh token revokes the session
        family. Browser clients should serialize refresh calls across tabs.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
          description: Must exactly match WEB_ORIGIN.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Missing, expired, revoked, or invalid authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission or station boundary denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Version conflict, duplicate record, or concurrent transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid fields or workflow transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Authentication rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description:
            Database unavailable or ambiguous operation result; reload authoritative state
            before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - refreshCookie: []
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke the session and clear the refresh cookie
      operationId: post_auth_logout
      description: ""
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
          description: Must exactly match WEB_ORIGIN.
      responses:
        "204":
          description: Success
        "401":
          description: Missing, expired, revoked, or invalid authentication
          content:
            application/json:
              schema:
